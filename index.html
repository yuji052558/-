<style>
  :root{
    --cream: #FBF8EF;
    --cream-2: #F3EAC9;
    --ink: #111111;
    --blue: #111111;
    --blue-dark: #000000;
    --sky: #FFF6D2;
    --white: #FFFFFF;
    --muted: #6B6B6B;
    --line: #E4DCC0;
    --yellow: #F9D423;
    --red: #FF4B3E;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width: 760px; margin:0 auto; padding: 24px 18px 90px; }

  /* ---------- HERO / LOGO ---------- */
  .hero{
    position:relative;
    text-align:center;
    background: var(--yellow);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 34px 18px 26px;
    margin: 6px 0 22px;
    overflow:visible;
  }
  .hero::before{ content:none; }
  .hero-top{
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:2px;
  }
  .plane{ font-size:26px; }
  .logo-img{
    position:relative;
    display:block;
    width: min(78%, 380px);
    height:auto;
    cursor:pointer;
  }
  .logo-text{
    position:relative;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(38px, 11vw, 62px);
    color: var(--ink);
    letter-spacing:0.5px;
    margin:0;
    line-height:1;
  }
  .hero-badge{
    position:absolute;
    top:-10px; right:-12px;
    width:88px; height:88px;
    background: var(--white);
    border: 2.5px solid var(--ink);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:10.5px; font-weight:800; line-height:1.25;
    padding:6px;
    color: var(--ink);
    z-index:1;
    animation: badge-spin 9s linear infinite;
  }
  @keyframes badge-spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  .hero .dashed-path{
    position:relative;
    height: 1px;
    border-top: 2.5px solid var(--ink);
    margin: 14px auto 12px;
    width: 60%;
  }
  .poll-title{
    position:relative;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:800;
    font-size: 18px;
    color: var(--ink);
    margin: 2px 0 4px;
  }
  .hero p.sub{ position:relative; color: #3a3a3a; margin:0; font-size:13px; font-weight:500; }

  .checker-divider{
    height: 6px;
    margin: 26px 0;
    border-radius: 4px;
    background: var(--ink);
    border: none;
  }

  .topnav{ display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .team-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); margin: 10px 2px 0;
  }
  .team-bar b{ color:var(--ink); }

  /* ---------- SITE HEADER / MENU ---------- */
  .nav-wrap{ position:relative; margin-bottom:14px; }
  .site-header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink); color:var(--yellow);
    padding:11px 14px; border-radius:14px;
  }
  .menu-hover-zone{ position:relative; display:inline-block; }
  .menu-toggle{
    background:none; border:1.5px solid var(--yellow); color:var(--yellow);
    padding:7px 11px; border-radius:8px; font-size:11.5px; font-weight:800; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .menu-toggle:hover{ background:rgba(249,212,35,0.15); }
  .site-header-brand{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; color:var(--yellow);
    cursor:pointer; letter-spacing:.5px;
  }
  .menu-panel{
    position:absolute; top:100%; left:0;
    width:240px; max-width:80vw;
    max-height:0; overflow-y:auto; opacity:0; pointer-events:none;
    transition:max-height .22s ease, opacity .18s ease;
    background:var(--white); border:0 solid var(--ink); border-radius:14px;
    box-shadow:0 12px 28px rgba(0,0,0,0.2);
    z-index:45;
  }
  .menu-panel.open{ max-height:min(70vh, 560px); border-width:1.5px; opacity:1; pointer-events:auto; }
  @media (hover:hover) and (pointer:fine){
    .menu-hover-zone:hover .menu-panel{ max-height:min(70vh, 560px); border-width:1.5px; opacity:1; pointer-events:auto; }
  }
  .menu-item{
    display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line);
    padding:13px 16px; font-size:14px; font-weight:700; color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .menu-item:hover{ background:var(--sky); }
  .menu-team-info{ padding:10px 16px; font-size:11.5px; color:var(--muted); }
  .menu-section-label{
    padding:10px 16px 4px; font-size:10.5px; font-weight:800; color:var(--muted);
    letter-spacing:1px; border-top:1.5px dashed var(--line); margin-top:4px;
  }

  /* ---------- HOME NAV ---------- */
  .home-nav-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px; }
  .home-nav-card{
    background:var(--white); border:1.5px solid var(--ink); border-radius:16px;
    padding:24px 10px; display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-weight:800; font-size:14px; color:var(--ink);
  }
  .home-nav-card:hover{ background:var(--sky); }
  .home-nav-icon{ font-size:34px; }

  /* ---------- CARDS / FORM ---------- */
  .card{
    background: var(--white);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .step-label{
    display:flex; align-items:center; gap:10px;
    font-family:'Do Hyeon', sans-serif;
    font-size: 19px;
    color: var(--blue);
    margin: 0 0 4px;
  }
  .step-num{
    width:28px; height:28px; border-radius:50%;
    background: var(--ink);
    color: var(--white);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex-shrink:0; font-family:'Noto Sans KR',sans-serif; font-weight:700;
  }
  .step-desc{ color: var(--muted); font-size: 12.5px; margin: 0 0 14px 38px; }

  input[type=text], input[type=number], input[type=month], input[type=time]{
    width:100%;
    padding: 11px 13px;
    background: var(--cream);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-size: 14.5px;
    font-family: inherit;
  }
  input:focus{ outline: 2px solid var(--blue); outline-offset:1px; }
  label.checkbox-label{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
    margin-top:10px; margin-left:38px;
  }

  .option-grid{ display:flex; flex-wrap:wrap; gap:9px; margin-left:38px; }
  .option-pill{
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--cream);
    color: var(--ink);
    font-size: 13.5px;
    cursor: pointer;
    transition: all .12s ease;
    user-select:none;
  }
  .option-pill:hover{ border-color: var(--blue); }
  .option-pill.selected{
    background: var(--blue);
    border-color: var(--blue);
    color:#fff;
    font-weight:700;
  }
  .other-input{ margin-left:38px; margin-top:10px; }
  .other-add-row{ display:flex; gap:8px; }
  .other-add-row button{
    background: var(--ink); color:#fff; border:none; border-radius:10px;
    padding: 0 16px; font-family:inherit; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .other-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .other-chip{
    display:flex; align-items:center; gap:6px;
    background: var(--sky); border:1px solid var(--blue);
    padding:5px 10px; border-radius:999px; font-size:12.5px;
  }
  .other-chip button{ background:none;border:none;color:var(--blue-dark);cursor:pointer;font-size:13px; }

  .submit-btn{
    display:block; width:100%; padding:14px; margin-top:20px;
    background: var(--ink); border:2.5px solid var(--ink); border-radius:12px; color:#fff;
    font-family:'Noto Sans KR', sans-serif; font-weight:800; font-size:15px; letter-spacing:.5px; cursor:pointer;
    text-transform:uppercase;
  }
  .submit-btn:hover{ background: var(--blue-dark); }
  .submit-btn:disabled{ opacity:.55; cursor:default; }
  .ghost-btn{
    background: var(--white); border:1.5px solid var(--line); color:var(--muted);
    padding: 8px 14px; border-radius:10px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .ghost-btn:hover{ border-color: var(--blue); color: var(--blue); }
  .admin-btn{
    background: var(--yellow); border:1.5px solid var(--ink); color:var(--ink);
    padding: 10px 16px; border-radius:10px; font-size:13px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-weight:700;
  }
  .admin-btn:hover{ filter:brightness(0.95); }
  .kakao-btn{
    background: #FEE500; border:1.5px solid var(--ink); color:#191919;
    padding: 10px 12px; border-radius:10px; font-size:13px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-weight:700;
  }
  .kakao-btn:hover{ filter:brightness(0.95); }
  .error-text{ color: var(--red); font-size: 12.5px; margin: 8px 0 0 38px; }
  .hint{ color: var(--muted); font-size:12px; margin: 6px 0 0; }

  .progress-wrap{ margin-bottom:14px; }
  .progress-track{
    background: var(--cream-2); border-radius:8px; height:10px; overflow:hidden; border:1px solid var(--line);
  }
  .progress-fill{ height:100%; background: var(--blue); border-radius:8px; }
  .progress-label{ font-size:12.5px; color:var(--muted); margin-bottom:6px; text-align:right; }

  .divider-title{
    font-family:'Do Hyeon', sans-serif; font-size:21px; color:var(--ink);
    text-align:center; margin: 30px 0 16px; position:relative;
  }
  .divider-title span{ background: var(--cream); padding:0 14px; position:relative; z-index:1; }
  .divider-title::before{ content:''; position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--line); }

  .bar-row{ margin-bottom:12px; }
  .bar-row .bar-label{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .bar-row .bar-label .win{ color: var(--blue); font-weight:700; }
  .bar-track{ background: var(--cream-2); border-radius:8px; height:15px; overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; background: var(--blue); border-radius:8px; min-width:2%; }

  .date-result-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 12px; border-radius:10px; border:1.5px solid var(--line);
    margin-bottom:8px; background: var(--cream);
  }
  .date-result-row.unanimous{ border-color: var(--blue); background: var(--sky); }
  .date-result-row .dinfo{ font-size:13.5px; }
  .date-result-row .dinfo .dow{ color:var(--muted); font-size:11.5px; margin-left:6px; }
  .stamp{
    font-family:'Do Hyeon', sans-serif; font-size:11px; color: var(--red);
    border:2px solid var(--red); border-radius:6px; padding:2px 8px; letter-spacing:.5px;
  }
  .badge-count{ font-size:11.5px; color: var(--muted); }

  .voter-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .voter-tag{
    display:flex; align-items:center; gap:6px;
    background: var(--cream); border:1px solid var(--line);
    padding:6px 10px; border-radius:999px; font-size:12.5px;
  }
  .voter-tag button{ background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;text-decoration:underline; }
  .voter-tag button:hover{ color: var(--blue); }
  .empty-note{ color: var(--muted); font-size:13px; text-align:center; padding:10px 0; }

  /* ---------- CALENDAR ---------- */
  .cal-head{ display:flex; justify-content:space-between; align-items:center; margin-left:38px; margin-bottom:8px; }
  .cal-head .cal-month{ font-family:'Do Hyeon', sans-serif; font-size:15px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; margin-left:38px; }
  .cal-dow{ text-align:center; font-size:11px; color:var(--muted); padding-bottom:2px; }
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:9px; border:1.5px solid var(--line); background:var(--cream);
    font-size:12.5px; cursor:pointer; position:relative;
  }
  .cal-day.blank{ visibility:hidden; }
  .cal-day.disabled{ opacity:.3; cursor:default; background:transparent; border-style:dashed; }
  .cal-day.selected{ background: var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .cal-day.excluded{ background:transparent; color:var(--muted); text-decoration:line-through; opacity:.5; }
  .cal-legend{ margin-left:38px; margin-top:8px; font-size:11.5px; color:var(--muted); }

  /* ---------- RESTAURANT ---------- */
  .resto-pill{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--cream); margin-bottom:8px; cursor:pointer;
  }
  .resto-pill.selected{ border-color:var(--blue); background:var(--sky); }
  .resto-pill .r-name{ font-weight:700; font-size:14px; }
  .resto-pill .r-note{ font-size:12px; color:var(--muted); }

  /* ---------- FINAL CARD ---------- */
  .final-card{
    background: var(--ink); color:#fff; border-radius:20px; padding:26px 22px; text-align:center;
    margin-bottom:20px;
  }
  .final-card .tag{ font-size:12px; letter-spacing:2px; color: var(--yellow); margin-bottom:8px; }
  .final-card h2{ font-family:'Do Hyeon', sans-serif; font-size:26px; margin:0 0 14px; }
  .final-row{ display:flex; justify-content:center; gap:8px; font-size:14px; margin-bottom:6px; }
  .final-row b{ color: var(--yellow); }

  /* 이미지 저장(캡처) 시에만 적용되는 스타일: 배지 숨기고 카드 간격을 없애 하나의 이미지처럼 붙임 */
  #final-card-capture.capturing .hero{ margin-bottom:0; border-bottom:none; border-radius:22px 22px 0 0; }
  #final-card-capture.capturing .hero-badge{ display:none; }
  #final-card-capture.capturing .checker-divider{ margin:0; border-radius:0; }
  #final-card-capture.capturing .final-card{ margin-bottom:0; border-radius:0 0 20px 20px; }

  .history-item{
    border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; background:var(--white);
  }
  .history-item .h-date{ font-family:'Do Hyeon', sans-serif; font-size:15px; color:var(--blue); }
  .history-item .h-meta{ font-size:12.5px; color:var(--muted); margin-top:4px; }

  /* ---------- ROULETTE ---------- */
  .roulette-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; margin-top:6px; }
  .roulette-pointer{ font-size:24px; color:var(--red); margin-bottom:-6px; z-index:2; }
  .roulette-wheel-outer{
    position:relative; width:240px; height:240px; border-radius:50%;
    border:4px solid var(--ink); overflow:hidden; background:var(--white);
  }
  .roulette-wheel{
    position:absolute; inset:0; border-radius:50%;
  }
  .wheel-label{
    position:absolute; top:50%; left:50%; width:0; height:0;
  }
  .wheel-label span{
    position:absolute; left:0; top:-96px; transform:translateX(-50%);
    font-size:11px; font-weight:800; white-space:nowrap; max-width:70px; overflow:hidden; text-overflow:ellipsis;
  }

  .footer-note{ text-align:center; color: var(--muted); font-size:12px; margin-top:26px; }
  .loading{ text-align:center; padding:60px 0; color: var(--muted); }
  .setup-note{
    background: var(--sky); border:1.5px dashed var(--blue); border-radius:12px; padding:12px 14px;
    font-size:12.5px; color:var(--ink); margin-bottom:16px; line-height:1.5;
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">불러오는 중...</div></div>

/* ==================== Firebase ==================== */
let db = null;
let auth = null;
let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  firebaseReady = true;
}catch(e){
  console.error('Firebase 초기화 실패', e);
}
let pollRef = null;
let historyRef = null;
let feedbackRef = null;
let membersRef = null;
let budgetRef = null;
let teamsRef = firebaseReady ? db.collection('teams') : null;
let orgDivisionsRef = firebaseReady ? db.collection('orgDivisions') : null;
let globalFeedbackRef = firebaseReady ? db.collection('globalFeedback') : null;
let userProfilesRef = firebaseReady ? db.collection('userProfiles') : null;
let myProfile = { color:'black', hat:null, glasses:null, scarf:null };
let myProfileLoaded = false;
let orgDivisions = [];
let orgDivisionsLoaded = false;
let teamId = null;
let teamDoc = null;
let teamEntryLoaded = false;
let authUser = null;
let authLoaded = false;
let authMode = 'login'; // 'login' | 'signup'
let authForm = { email:'', password:'', password2:'', displayName:'', division:'', teamChoice:'' };
let authError = '';
let unsubscribePoll = null;
let unsubscribeMembers = null;
let memberNames = [];
let unsubscribeBudget = null;
let budgetDoc = null;
let budgetLoaded = false;

function usernameToEmail(username){
  return `${username.trim().toLowerCase().replace(/\s+/g,'_')}@bokpick.local`;
}

const FIXED_ADMIN_USERNAME = 'cyj';
function isAdmin(){
  return !!(authUser && authUser.email === usernameToEmail(FIXED_ADMIN_USERNAME));
}
async function claimAdmin(){
  await teamsRef.doc(teamId).update({ adminUid: authUser.uid });
  teamDoc = Object.assign({}, teamDoc, { adminUid: authUser.uid });
}

function getTeamIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const t = params.get('team');
  return t ? t.trim() : null;
}
function setTeamRefs(id){
  pollRef = db.collection('teams').doc(id).collection('polls').doc('current');
  historyRef = db.collection('teams').doc(id).collection('polls').doc('history');
  feedbackRef = db.collection('teams').doc(id).collection('polls').doc('feedback');
  membersRef = db.collection('teams').doc(id).collection('polls').doc('members');
  budgetRef = db.collection('teams').doc(id).collection('polls').doc('budget');
}
function genTeamCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}
function attachPollListener(){
  if(unsubscribePoll) unsubscribePoll();
  unsubscribePoll = pollRef.onSnapshot(snap=>{
    currentDoc = snap.exists ? snap.data() : null;
    docLoaded = true;
    render();
  }, err=>{
    console.error('poll listen error', err);
    docLoaded = true;
    render();
  });
}
function attachMembersListener(){
  if(unsubscribeMembers) unsubscribeMembers();
  unsubscribeMembers = membersRef.onSnapshot(snap=>{
    memberNames = snap.exists ? (snap.data().names||[]) : [];
    render();
  }, err=>{
    console.error('members listen error', err);
  });
}
function attachBudgetListener(){
  if(unsubscribeBudget) unsubscribeBudget();
  unsubscribeBudget = budgetRef.onSnapshot(snap=>{
    budgetDoc = snap.exists ? snap.data() : { totalBudget: 0, expenses: [] };
    budgetLoaded = true;
    render();
  }, err=>{
    console.error('budget listen error', err);
    budgetLoaded = true;
  });
}
async function setBudgetTotal(amount){
  await budgetRef.set({ totalBudget: amount, expenses: (budgetDoc && budgetDoc.expenses) || [] }, { merge: true });
}

/* ==================== 팀원 계정 등록 (관리자용) ==================== */
let secondaryApp = null;
function getSecondaryAuth(){
  if(!secondaryApp){
    secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary');
  }
  return secondaryApp.auth();
}
async function adminCreateAccount(name, username, password, targetTeamId, targetTeamName){
  const teamSnap = await teamsRef.doc(targetTeamId).get();
  if(!teamSnap.exists){
    await teamsRef.doc(targetTeamId).set({ teamName: targetTeamName, createdAt: Date.now(), adminUid: authUser.uid });
  }
  const secAuth = getSecondaryAuth();
  const cred = await secAuth.createUserWithEmailAndPassword(usernameToEmail(username), password);
  await cred.user.updateProfile({ displayName: name });
  const uid = cred.user.uid;
  await db.collection('userTeams').doc(uid).set({ teamId: targetTeamId, teamName: targetTeamName || '' });
  await secAuth.signOut();
  return uid;
}
async function saveUserTeamMapping(uid){
  await db.collection('userTeams').doc(uid).set({ teamId: teamId, teamName: (teamDoc && teamDoc.teamName) || '' });
}
async function lookupUserTeam(uid){
  const snap = await db.collection('userTeams').doc(uid).get();
  return snap.exists ? snap.data() : null;
}

/* ==================== 조직 구조 (본부/팀) - 관리자 전용 ==================== */
async function loadOrgDivisions(){
  try{
    const snap = await orgDivisionsRef.get();
    orgDivisions = snap.docs.map(d=>d.data());
  }catch(e){
    console.error(e);
    orgDivisions = [];
  }
  orgDivisionsLoaded = true;
  render();
}
async function addDivision(name){
  await orgDivisionsRef.doc(name).set({ name, teams: [] }, { merge:true });
  await loadOrgDivisions();
}
async function addTeamToDivision(divisionName, teamName, existingTeamId){
  const teamId = (existingTeamId && existingTeamId.trim()) ? existingTeamId.trim() : `${divisionName}_${teamName}`;
  await db.runTransaction(async (tx)=>{
    const ref = orgDivisionsRef.doc(divisionName);
    const snap = await tx.get(ref);
    const teams = snap.exists ? (snap.data().teams||[]) : [];
    const filtered = teams.filter(t=> (typeof t==='string' ? t : t.name) !== teamName);
    filtered.push({ name: teamName, teamId });
    tx.set(ref, { name: divisionName, teams: filtered });
  });
  await loadOrgDivisions();
}
async function removeTeamFromDivision(divisionName, teamName){
  await db.runTransaction(async (tx)=>{
    const ref = orgDivisionsRef.doc(divisionName);
    const snap = await tx.get(ref);
    if(!snap.exists) return;
    const teams = (snap.data().teams||[]).filter(t=> (typeof t==='string' ? t : t.name) !== teamName);
    tx.set(ref, { name: divisionName, teams });
  });
  await loadOrgDivisions();
}
async function removeDivision(divisionName){
  await orgDivisionsRef.doc(divisionName).delete();
  await loadOrgDivisions();
}

async function addExpense(amount, memo){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(budgetRef);
    const data = snap.exists ? snap.data() : { totalBudget: 0, expenses: [] };
    const expenses = (data.expenses || []).slice();
    expenses.unshift({ amount, memo, createdAt: Date.now() });
    tx.set(budgetRef, { totalBudget: data.totalBudget || 0, expenses });
  });
}
async function deleteExpense(createdAt){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(budgetRef);
    if(!snap.exists) return;
    const data = snap.data();
    const expenses = (data.expenses || []).filter(e=>e.createdAt !== createdAt);
    tx.set(budgetRef, { totalBudget: data.totalBudget || 0, expenses });
  });
}
async function resetBudgetMonth(newTotal){
  await budgetRef.set({ totalBudget: newTotal, expenses: [] });
}
async function addMember(name){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(membersRef);
    const names = snap.exists ? (snap.data().names||[]) : [];
    if(!names.includes(name)) names.push(name);
    tx.set(membersRef, { names });
  });
}

function emptyVoteForm(){
  return { name:'', activities:new Set(), activityNotes:[], activityNoteInput:'',
           foods:new Set(), foodNotes:[], foodNoteInput:'', dates:new Set() };
}
function defaultMonth(){
  const d = new Date();
  d.setMonth(d.getMonth()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderNamePicker(prefix, selectedName){
  return `
    <div class="option-grid" id="${prefix}-name-grid" style="margin-left:0;">
      ${memberNames.map(n=>`<div class="option-pill ${selectedName===n?'selected':''}" data-name="${esc(n)}">${esc(n)}</div>`).join('')}
    </div>
    ${memberNames.length===0 ? `<p class="hint" style="margin:8px 0 0;">아직 등록된 팀원이 없어요. 아래에서 이름을 추가해주세요.</p>` : ''}
    <div class="other-add-row" style="margin-top:10px;">
      <input type="text" id="${prefix}-name-new-input" placeholder="명단에 없으면 이름 추가">
      <button id="${prefix}-name-add-btn">추가</button>
    </div>
  `;
}
function bindNamePicker(prefix, onSelect){
  document.querySelectorAll(`#${prefix}-name-grid .option-pill`).forEach(el=>{
    el.addEventListener('click', ()=> onSelect(el.dataset.name));
  });
  const addBtn = document.getElementById(`${prefix}-name-add-btn`);
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const input = document.getElementById(`${prefix}-name-new-input`);
    const val = input.value.trim();
    if(!val) return;
    addBtn.disabled = true;
    try{
      await addMember(val);
      onSelect(val);
    }catch(e){
      console.error(e);
      addBtn.disabled = false;
    }
  });
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return { md:`${d.getMonth()+1}/${d.getDate()}`, dow: DOW[d.getDay()] };
}

function getDailyFortune(){
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  let hash = 0;
  for(let i=0;i<dateStr.length;i++){ hash = (hash*31 + dateStr.charCodeAt(i)) >>> 0; }
  const idx = hash % FORTUNES.length;
  return FORTUNES[idx];
}
function renderFortuneInline(){
  const f = getDailyFortune();
  return `
    <p class="sub" style="margin-top:6px;">🔮 ${esc(f.message)}${f.food ? ` <span style="font-weight:800;">(추천메뉴: ${esc(f.food)})</span>` : ''}</p>
  `;
}

function renderHomeStatusCard(){
  if(!docLoaded) return '';
  if(!currentDoc){
    return `
      <div class="card" style="text-align:center;">
        <p class="empty-note" style="padding:4px 0 12px;">아직 진행중인 회식 투표가 없어요.</p>
        <button class="admin-btn" id="home-status-btn">새 투표 만들기</button>
      </div>
    `;
  }
  if(currentDoc.stage==='done'){
    const s = currentDoc.finalSummary || {};
    const d = s.date ? fmtDate(s.date) : null;
    const monthStr = s.date ? s.date.slice(0,7) : null;
    return `
      <div class="card">
        <div class="step-label" style="font-size:15px;">✅ 이번 회식 확정</div>
        ${monthStr ? renderMiniCalendar(monthStr, s.date) : `<div style="font-size:14px; margin-bottom:6px;"><b>날짜 미정</b></div>`}

        <div style="font-size:13.5px; color:var(--muted); margin-bottom:4px; text-align:center;">${(s.activities||[]).map(esc).join(', ')||'-'}${s.foods&&s.foods.length?` · ${s.foods.map(esc).join(', ')}`:''}</div>
        ${s.restaurantName ? `<div style="font-size:13.5px; color:var(--muted); margin-bottom:4px; text-align:center;">📍 ${esc(s.restaurantName)}${s.time?` · 🕐 ${esc(s.time)}`:''}</div>` : ''}
        <button class="ghost-btn" id="home-status-btn" style="margin-top:8px;">자세히 보기</button>
      </div>
    `;
  }
  const label = currentDoc.stage==='restaurant' ? '🍽 식당 투표 진행중' : '🗳️ 1차 투표 진행중';
  return `
    <div class="card">
      <div class="step-label" style="font-size:15px;">${label}</div>

      <button class="admin-btn" id="home-status-btn" style="margin-top:4px;">투표하러 가기</button>
    </div>
  `;
}

function renderBudgetSummaryCard(){
  if(!budgetLoaded) return '';
  const total = (budgetDoc && budgetDoc.totalBudget) || 0;
  const spent = ((budgetDoc && budgetDoc.expenses) || []).reduce((s,e)=>s+e.amount,0);
  const remain = total - spent;
  const pct = total>0 ? Math.min(100, Math.round(spent/total*100)) : 0;
  return `
    <div class="card">
      <div class="step-label" style="font-size:15px;">💰 이번 달 복후비</div>
      ${total===0 ? `<p class="step-desc" style="margin-left:0;">아직 예산이 설정되지 않았어요.</p>` : `
        <div class="progress-label" style="text-align:left; margin-bottom:4px;">남은 금액 <b style="color:var(--ink);">${remain.toLocaleString()}원</b> / 총 ${total.toLocaleString()}원</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${remain<0?'var(--red)':'var(--ink)'};"></div></div>
      `}
      <button class="ghost-btn" id="budget-summary-manage-btn" style="margin-top:12px;">관리하기</button>
    </div>
  `;
}

function monthDates(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const arr = [];
  for(let d=1; d<=days; d++){
    const dt = new Date(y, m-1, d);
    arr.push({ iso: `${monthStr}-${String(d).padStart(2,'0')}`, day:d, dow: dt.getDay() });
  }
  return arr;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  try{
    const snap = await historyRef.get();
    historyItems = snap.exists ? (snap.data().items||[]) : [];
  }catch(e){
    console.error(e);
    historyItems = [];
  }
  render();
}

async function loadFeedback(){

  try{

  }catch(e){

async function submitFeedback(name, message){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(feedbackRef);
    const items = snap.exists ? (snap.data().items||[]) : [];
    items.unshift({ name: name||'익명', message, createdAt: Date.now() });
    if(items.length>100) items.length = 100;
    tx.set(feedbackRef, { items });
  });
  try{
    await globalFeedbackRef.add({
      teamId: teamId,
      teamName: (teamDoc && teamDoc.teamName) || teamId,
      name: name||'익명',
      message,
      createdAt: Date.now()
    });
  }catch(e){ console.error(e); }
}

async function loadGlobalFeedback(){
  try{
    const snap = await globalFeedbackRef.orderBy('createdAt','desc').limit(200).get();
    globalFeedbackItems = snap.docs.map(d=>d.data());
  }catch(e){
    console.error(e);
    globalFeedbackItems = [];
  }
  render();
}

async function createPoll(cfg){

    title: cfg.title, teamSize: cfg.teamSize, month: cfg.month, dates: cfg.dates,
    stage: 'voting', votes:{}, resultsA:null,
    restaurant: { options:[], votes:{} },
    finalSummary: null, archived:false, createdAt: Date.now()
  });
}

async function updateTeamSize(newSize){
  await pollRef.update({ teamSize: newSize });
}

async function saveVote(name, voteData, prevName){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(pollRef);
    if(!snap.exists) throw new Error('no-poll');
    const data = snap.data();
    const votes = Object.assign({}, data.votes||{});
    if(prevName && prevName!==name) delete votes[prevName];
    votes[name] = voteData;
    tx.update(pollRef, { votes });
  });
}

async function closeStageA(){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(pollRef);
    if(!snap.exists) return;
    const data = snap.data();
    const res = computeResultsA(data);
    const goesToRestaurant = res.winnerActivities.some(a=>NEEDS_FOOD.includes(a));
    if(goesToRestaurant){
      tx.update(pollRef, { resultsA: res, stage: 'restaurant' });
    } else {
      const summary = {
        title: data.title, date: res.winnerDate,
        activities: res.winnerActivities, foods: res.winnerFoods,
        restaurantName: null, time: null
      };
      tx.update(pollRef, { resultsA: res, stage: 'done', finalSummary: summary, archived: true });
    }
  });
  const snap = await pollRef.get();
  const data = snap.data();
  if(data.stage === 'done' && data.finalSummary){
    await archiveResult(data.finalSummary);
  }
}

async function addRestaurantOption(name, note){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(pollRef);
    if(!snap.exists) return;
    const data = snap.data();
    const options = (data.restaurant && data.restaurant.options) ? data.restaurant.options.slice() : [];
    options.push({ id: uid(), name, note });
    const restaurant = Object.assign({}, data.restaurant, { options });
    tx.update(pollRef, { restaurant });
  });
}

async function saveRestoVote(name, optionId, prevName){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(pollRef);
    if(!snap.exists) return;
    const data = snap.data();
    const votes = Object.assign({}, (data.restaurant && data.restaurant.votes) || {});
    if(prevName && prevName!==name) delete votes[prevName];
    votes[name] = optionId;
    const restaurant = Object.assign({}, data.restaurant, { votes });
    tx.update(pollRef, { restaurant });
  });
}

async function finalizeRestaurant(optionId, time){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(pollRef);
    if(!snap.exists) return;
    const data = snap.data();
    const opt = (data.restaurant.options||[]).find(o=>o.id===optionId);
    const summary = {
      title: data.title, date: data.resultsA.winnerDate,
      activities: data.resultsA.winnerActivities, foods: data.resultsA.winnerFoods,
      restaurantName: opt ? opt.name : null, time: time || null
    };
    tx.update(pollRef, { stage:'done', finalSummary: summary, archived:true });
  });
  const snap = await pollRef.get();
  await archiveResult(snap.data().finalSummary);
}

async function archiveResult(summary){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(historyRef);
    const items = snap.exists ? (snap.data().items||[]) : [];
    items.unshift(Object.assign({}, summary, { archivedAt: Date.now() }));
    if(items.length>50) items.length = 50;
    tx.set(historyRef, { items });
  });
  historyItems = null; // 다음에 다시 불러오게
}

async function deleteHistoryItem(archivedAt){
  await db.runTransaction(async (tx)=>{
    const snap = await tx.get(historyRef);
    if(!snap.exists) return;
    const items = (snap.data().items||[]).filter(it=>it.archivedAt !== archivedAt);
    tx.set(historyRef, { items });
  });
}

async function startNewPoll(){
  await pollRef.delete();
}

/* ==================== 결과 계산 ==================== */
function computeResultsA(data){
  const votes = data.votes || {};
  const total = Object.keys(votes).length;
  const activityCounts = {}; ACTIVITY_OPTS.forEach(a=>activityCounts[a]=0);
  const foodCounts = {}; FOOD_OPTS.forEach(f=>foodCounts[f]=0);
  const dateCounts = {}; (data.dates||[]).forEach(d=>dateCounts[d]=0);
  let foodVoterTotal = 0;
  const activityNotes = [];
  const foodNotes = [];

  Object.entries(votes).forEach(([name, v])=>{
    (v.activities||[]).forEach(a=>{ if(activityCounts[a]!==undefined) activityCounts[a]++; });
    (v.activityNotes||[]).forEach(note=> activityNotes.push({name, note}));
    const needsFood = (v.activities||[]).some(a=>NEEDS_FOOD.includes(a));
    if(needsFood && (v.foods||[]).length){
      foodVoterTotal++;
      v.foods.forEach(f=>{ foodCounts[f] = (foodCounts[f]||0)+1; });
      (v.foodNotes||[]).forEach(note=> foodNotes.push({name, note}));
    }
    (v.dates||[]).forEach(d=>{ if(dateCounts[d]!==undefined) dateCounts[d]++; });
  });

  const maxActivity = Math.max(0, ...Object.values(activityCounts));
  const maxFood = Math.max(0, ...Object.values(foodCounts));
  const winnerActivities = ACTIVITY_OPTS.filter(a=>activityCounts[a]>0 && activityCounts[a]===maxActivity);
  const winnerFoods = FOOD_OPTS.filter(f=>foodCounts[f]>0 && foodCounts[f]===maxFood);

  const teamSize = data.teamSize || 0;
  const unanimousDates = teamSize>0 ? (data.dates||[]).filter(d=>dateCounts[d]===teamSize) : [];
  const maxDateCount = Math.max(0, ...Object.values(dateCounts));
  const sortedDates = (data.dates||[]).slice().sort((a,b)=> dateCounts[b]-dateCounts[a] || a.localeCompare(b));
  const top3Dates = sortedDates.filter(d=>dateCounts[d]>0).slice(0,3);
  const winnerDate = unanimousDates.length ? unanimousDates[0] : (top3Dates[0] || null);

  return { total, activityCounts, foodCounts, foodVoterTotal, dateCounts, maxActivity, maxFood,
           maxDateCount, unanimousDates, top3Dates, activityNotes, foodNotes,
           winnerActivities, winnerFoods, winnerDate };
}

function computeRestoResults(data){
  const votes = (data.restaurant && data.restaurant.votes) || {};
  const options = (data.restaurant && data.restaurant.options) || [];
  const total = Object.keys(votes).length;
  const counts = {};
  options.forEach(o=>counts[o.id]=0);
  Object.values(votes).forEach(optId=>{ if(counts[optId]!==undefined) counts[optId]++; });
  const max = Math.max(0, ...Object.values(counts));
  const winnerId = options.find(o=>counts[o.id]>0 && counts[o.id]===max);
  return { total, counts, winnerId: winnerId ? winnerId.id : null };
}

/* ==================== 렌더 진입점 ==================== */
function render(){
  const app = document.getElementById('app');
  if(!firebaseReady){
    app.innerHTML = `<div class="card" style="margin-top:40px;">
      <div class="step-label" style="color:var(--red);">⚠️ Firebase 설정이 필요해요</div>
      <p style="font-size:13.5px; color:var(--muted); margin-left:0;">
      코드 상단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 정보로 채워주세요.
      설정 방법은 채팅 답변을 참고해주세요.</p>
    </div>`;
    return;
  }
  if(!authLoaded){
    app.innerHTML = `<div class="loading">불러오는 중...</div>`;
    return;
  }
  if(!authUser){
    if(!orgDivisionsLoaded){
      app.innerHTML = `<div class="loading">불러오는 중...</div>`;
      return;
    }
    app.innerHTML = renderAuthScreen();
    bindAuthEvents();
    return;
  }

  if(!teamEntryLoaded){
    app.innerHTML = `<div class="loading">불러오는 중...</div>`;
    return;
  }
  if(!teamId){
    app.innerHTML = renderTeamEntry();
    bindTeamEntryEvents();
    return;
  }

  if(currentView==='history'){
    if(historyItems===null){ app.innerHTML = renderSiteHeader() + `<div class="loading">기록 불러오는 중...</div>`; bindSiteHeader(); loadHistory(); return; }
    app.innerHTML = renderSiteHeader() + renderHistory();
    bindSiteHeader();
    bindHistoryEvents();
    return;
  }
  if(currentView==='feedback'){
    if(feedbackItems===null){ app.innerHTML = renderSiteHeader() + `<div class="loading">불러오는 중...</div>`; bindSiteHeader(); loadFeedback(); return; }
    app.innerHTML = renderSiteHeader() + renderFeedback();
    bindSiteHeader();
    bindFeedbackEvents();
    return;
  }
  if(currentView==='roulette'){
    app.innerHTML = renderSiteHeader() + renderRoulette();
    bindSiteHeader();
    bindRouletteEvents();
    return;
  }
  if(currentView==='customize'){
    if(!myProfileLoaded){ app.innerHTML = renderSiteHeader() + `<div class="loading">불러오는 중...</div>`; bindSiteHeader(); loadMyProfile(); return; }
    app.innerHTML = renderSiteHeader() + renderCustomize();
    bindSiteHeader();
    bindCustomizeEvents();
    return;
  }
  if(currentView==='my-page'){
    if(!myProfileLoaded){ loadMyProfile(); }
    app.innerHTML = renderSiteHeader() + renderMyPage();
    bindSiteHeader();
    bindMyPageEvents();
    return;
  }
  if(currentView==='change-password'){
    app.innerHTML = renderSiteHeader() + renderChangePassword();
    bindSiteHeader();
    bindChangePasswordEvents();
    return;
  }
  if(currentView==='global-feedback'){
    if(!isAdmin()){ currentView='home'; }
    else {
      if(globalFeedbackItems===null){ app.innerHTML = renderSiteHeader() + `<div class="loading">불러오는 중...</div>`; bindSiteHeader(); loadGlobalFeedback(); return; }
      app.innerHTML = renderSiteHeader() + renderGlobalFeedback();
      bindSiteHeader();
      bindGlobalFeedbackEvents();
      return;
    }
  }
  if(currentView==='org-admin'){
    if(!isAdmin()){ currentView='home'; }
    else {
      app.innerHTML = renderSiteHeader() + renderOrgAdmin();
      bindSiteHeader();
      bindOrgAdminEvents();
      return;
    }
  }
  if(currentView==='members-admin'){
    if(!isAdmin()){ currentView='home'; }
    else {
      app.innerHTML = renderSiteHeader() + renderMembersAdmin();
      bindSiteHeader();
      bindMembersAdminEvents();
      return;
    }
  }
  if(currentView==='budget'){
    app.innerHTML = renderSiteHeader() + renderBudget();
    bindSiteHeader();
    bindBudgetEvents();
    return;
  }
  if(currentView==='home'){
    app.innerHTML = renderSiteHeader() + renderHome();
    bindSiteHeader();
    bindHomeEvents();
    return;
  }
  // currentView === 'vote'
  if(!docLoaded){ app.innerHTML = renderSiteHeader() + `<div class="loading">불러오는 중...</div>`; bindSiteHeader(); return; }
  if(!currentDoc){
    app.innerHTML = renderSiteHeader() + renderSetup();
    bindSiteHeader();
    bindSetupEvents();
    return;
  }
  if(currentDoc.stage==='voting'){
    app.innerHTML = renderSiteHeader() + renderVoting(currentDoc);
    bindSiteHeader();
    bindVotingEvents(currentDoc);
  } else if(currentDoc.stage==='restaurant'){
    app.innerHTML = renderSiteHeader() + renderRestaurant(currentDoc);
    bindSiteHeader();
    bindRestaurantEvents(currentDoc);
  } else {
    app.innerHTML = renderSiteHeader() + renderDone(currentDoc);
    bindSiteHeader();
    bindDoneEvents(currentDoc);
  }
}

// mode: 'setup'  -> excludedSet 토글, weekdayOnly 시각 반영
// mode: 'voting' -> allowedSet(후보일) 중에서만 selectedSet 토글
function renderMiniCalendar(monthStr, highlightDate){
  const dates = monthDates(monthStr);
  const firstDow = new Date(monthStr+'-01T00:00:00').getDay();
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day blank"></div>`;
  dates.forEach(({iso, day})=>{
    const isHighlight = iso === highlightDate;
    cells += `<div class="cal-day ${isHighlight?'selected':''}" style="cursor:default;">${day}</div>`;
  });
  return `
    <div class="cal-head" style="margin-left:0;"><span class="cal-month">${monthStr.split('-')[0]}년 ${Number(monthStr.split('-')[1])}월</span></div>
    <div class="cal-grid" style="margin-left:0;">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

function renderCalendar(monthStr, opts){
  const { mode, excludedSet, weekdayOnly, allowedSet, selectedSet } = opts;
  const dates = monthDates(monthStr);
  const firstDow = new Date(monthStr+'-01T00:00:00').getDay();
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day blank"></div>`;
  dates.forEach(({iso, day, dow})=>{
    if(mode==='setup'){
      const weekend = (dow===0||dow===6);
      const excluded = excludedSet.has(iso) || (weekdayOnly && weekend);
      cells += `<div class="cal-day ${excluded?'excluded':'selected'}" data-date="${iso}">${day}</div>`;
    } else {
      const allowed = allowedSet.has(iso);
      const selected = selectedSet.has(iso);
      cells += `<div class="cal-day ${!allowed?'disabled':''} ${selected?'selected':''}" data-date="${iso}" ${!allowed?'data-disabled="1"':''}>${day}</div>`;
    }
  });
  return `
    <div class="cal-head"><span class="cal-month">${monthStr.split('-')[0]}년 ${Number(monthStr.split('-')[1])}월</span></div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

        return `<div class="bar-row"><div class="bar-label"><span>${esc(a)} ${win?'<span class="win">🏆 선정</span>':''}</span><span>${c}표</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct2}%"></div></div></div>`;
      }).join('')}
      ${res.activityNotes.length ? `<div class="hint">💬 ${res.activityNotes.map(n=>`${esc(n.name)}: ${esc(n.note)}`).join(' · ')}</div>` : ''}
    </div>
    ${res.foodVoterTotal>0 ? `
    <div class="card">
      <div class="step-label" style="font-size:16px;">🍚 메뉴</div>
      ${FOOD_OPTS.map(f=>{
        const c = res.foodCounts[f];
        const pct2 = res.foodVoterTotal ? Math.min(100, Math.round(c/res.foodVoterTotal*100)) : 0;
        const win = c>0 && c===res.maxFood;
        return `<div class="bar-row"><div class="bar-label"><span>${esc(f)} ${win?'<span class="win">🏆 선정</span>':''}</span><span>${c}표</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct2}%"></div></div></div>`;
      }).join('')}
      ${res.foodNotes.length ? `<div class="hint">💬 ${res.foodNotes.map(n=>`${esc(n.name)}: ${esc(n.note)}`).join(' · ')}</div>` : ''}
    </div>` : ''}
    <div class="card">
      <div class="step-label" style="font-size:16px;">📅 날짜 TOP 3</div>
      ${res.top3Dates.length===0 ? `<p class="empty-note" style="padding:4px 0;">아직 선택된 날짜가 없어요.</p>` :
        res.top3Dates.map(d=>{
          const {md,dow} = fmtDate(d);
          const c = res.dateCounts[d];
          const isUnanimous = res.unanimousDates.includes(d);
          return `<div class="date-result-row ${isUnanimous?'unanimous':''}">
            <span class="dinfo">${md}<span class="dow">${dow}요일</span></span>
            <span style="display:flex; align-items:center; gap:8px;">
              <span class="badge-count">${c}/${doc.teamSize}명 가능</span>
              ${isUnanimous?'<span class="stamp">만장일치</span>':''}
            </span>
          </div>`;
        }).join('')}
    </div>
    <div class="card">
      <div class="step-label" style="font-size:16px;">🙋 투표한 사람 (${res.total}명)</div>
      <div class="voter-list">
        ${Object.keys(doc.votes||{}).map(n=>`<span class="voter-tag">${esc(n)} ${(authUser && n===(authUser.displayName||authUser.email))?`<button data-name="${esc(n)}" class="edit-vote">수정</button>`:''}</span>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="step-label" style="font-size:16px;">🔒 관리자</div>
      <p class="step-desc" style="margin-left:0;">팀원 총 인원이 바뀌었다면 여기서 수정할 수 있어요.</p>
      <div class="other-add-row" style="margin-bottom:16px;">
        <input type="number" id="teamsize-edit-input" min="1" value="${teamSizeEditVal===null?doc.teamSize:teamSizeEditVal}">
        <button id="teamsize-save-btn">저장</button>
      </div>
      <p class="step-desc" style="margin-left:0;">모두 투표를 마쳤다면 1차 투표를 마감해서 다음 단계로 넘어가세요.</p>
      ${closeConfirming ? `
        <div style="color:var(--red); font-size:13px; margin-bottom:10px;">정말 마감할까요? 이후에는 활동/메뉴/날짜 투표를 더 받을 수 없어요.</div>
        <button class="ghost-btn" id="close-cancel-btn" style="margin-right:8px;">취소</button>
        <button class="admin-btn" id="close-confirm-btn">마감 확정</button>
      ` : `<button class="admin-btn" id="close-stageA-btn">1차 투표 마감하기</button>`}
    </div>
    `}
    <div class="footer-note">Firestore로 실시간 동기화돼요 · 팀원 링크만 공유하면 끝!</div>
  `;
}

function renderOtherBlock(kind){
  const list = kind==='activity' ? voteForm.activityNotes : voteForm.foodNotes;
  const inputVal = kind==='activity' ? voteForm.activityNoteInput : voteForm.foodNoteInput;
  const placeholder = kind==='activity' ? '하고 싶은 활동을 적고 추가를 눌러주세요' : '먹고 싶은 메뉴를 적고 추가를 눌러주세요';
  return `
    <div class="other-input">
      <div class="other-add-row">
        <input type="text" id="${kind}-note-input" placeholder="${placeholder}" value="${esc(inputVal)}">
        <button id="${kind}-note-add-btn">추가</button>
      </div>
      ${list.length ? `<div class="other-chip-row">${list.map((n,i)=>`<span class="other-chip">${esc(n)} <button data-kind="${kind}" data-idx="${i}" class="rm-other">✕</button></span>`).join('')}</div>` : ''}
    </div>

function bindVotingEvents(doc){
  document.querySelectorAll('#activity-grid .option-pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      const val = el.dataset.val;
      if(voteForm.activities.has(val)) voteForm.activities.delete(val); else voteForm.activities.add(val);
      if(!voteForm.activities.has('기타 활동')) voteForm.activityNotes = [];
      if(![...voteForm.activities].some(a=>NEEDS_FOOD.includes(a))){ voteForm.foods=new Set(); voteForm.foodNotes=[]; }
      render();
    });
  });
  bindOtherEvents('activity');

  const foodGrid = document.getElementById('food-grid');
  if(foodGrid){
    foodGrid.querySelectorAll('.option-pill').forEach(el=>{
      el.addEventListener('click', ()=>{
        const val = el.dataset.val;
        if(voteForm.foods.has(val)) voteForm.foods.delete(val); else voteForm.foods.add(val);
        if(!voteForm.foods.has('기타')) voteForm.foodNotes = [];
        render();
      });
    });
  }
  bindOtherEvents('food');

  document.querySelectorAll('.cal-day[data-date]:not([data-disabled])').forEach(el=>{
    el.addEventListener('click', ()=>{
      const d = el.dataset.date;
      if(voteForm.dates.has(d)) voteForm.dates.delete(d); else voteForm.dates.add(d);
      render();
    });
  });

  document.getElementById('submit-vote-btn').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const errEl = document.getElementById('form-error');
    const name = voteForm.name.trim();
    const needsFood = [...voteForm.activities].some(a=>NEEDS_FOOD.includes(a));
    if(!name){ errEl.textContent='이름을 입력해주세요.'; errEl.style.display='block'; return; }
    if(voteForm.activities.size===0){ errEl.textContent='활동을 1개 이상 선택해주세요.'; errEl.style.display='block'; return; }
    if(voteForm.activities.has('기타 활동') && voteForm.activityNotes.length===0){ errEl.textContent='기타 활동을 최소 1개 추가해주세요.'; errEl.style.display='block'; return; }
    if(needsFood && voteForm.foods.size===0){ errEl.textContent='메뉴를 1개 이상 선택해주세요.'; errEl.style.display='block'; return; }
    if(voteForm.foods.has('기타') && voteForm.foodNotes.length===0){ errEl.textContent='기타 메뉴를 최소 1개 추가해주세요.'; errEl.style.display='block'; return; }
    if(voteForm.dates.size===0){ errEl.textContent='가능한 날짜를 1개 이상 선택해주세요.'; errEl.style.display='block'; return; }

    errEl.style.display='none';
    btn.disabled=true; btn.textContent='저장 중...';
    const voteData = {
      activities: Array.from(voteForm.activities), activityNotes: voteForm.activityNotes.slice(),
      foods: Array.from(voteForm.foods), foodNotes: voteForm.foodNotes.slice(),
      dates: Array.from(voteForm.dates)
    };
    try{
      await saveVote(name, voteData, editingName);
      editingName = null;
      voteForm = emptyVoteForm();
    }catch(e){
      console.error(e);
      errEl.textContent = '저장에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.';
      errEl.style.display='block';
      btn.disabled=false; btn.textContent = editingName?'투표 수정하기':'투표 제출하기';
    }
  });

  document.querySelectorAll('.edit-vote').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = btn.dataset.name;
      const v = doc.votes[n];
      editingName = n;
      voteForm = {
        name:n, activities:new Set(v.activities||[]), activityNotes:(v.activityNotes||[]).slice(), activityNoteInput:'',
        foods:new Set(v.foods||[]), foodNotes:(v.foodNotes||[]).slice(), foodNoteInput:'',
        dates:new Set(v.dates||[])
      };
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  const teamsizeInput = document.getElementById('teamsize-edit-input');
  if(teamsizeInput) teamsizeInput.addEventListener('input', e=>{ teamSizeEditVal = Math.max(1, parseInt(e.target.value)||1); });
  const teamsizeSaveBtn = document.getElementById('teamsize-save-btn');
  if(teamsizeSaveBtn) teamsizeSaveBtn.addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const val = teamSizeEditVal===null ? doc.teamSize : teamSizeEditVal;
    btn.disabled = true; btn.textContent='저장 중...';
    try{ await updateTeamSize(val); }
    catch(e){ console.error(e); }
    btn.disabled = false; btn.textContent='저장';
  });

  const closeBtn = document.getElementById('close-stageA-btn');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ closeConfirming=true; render(); });
  const cancelBtn = document.getElementById('close-cancel-btn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ closeConfirming=false; render(); });
  const confirmBtn = document.getElementById('close-confirm-btn');
  if(confirmBtn) confirmBtn.addEventListener('click', async (ev)=>{
    const b = ev.currentTarget;
    b.disabled=true; b.textContent='마감 중...';
    try{ await closeStageA(); }
    catch(e){ console.error(e); b.disabled=false; b.textContent='마감 확정'; }
    closeConfirming=false;
  });
}

function bindOtherEvents(kind){
  const input = document.getElementById(`${kind}-note-input`);
  if(input) input.addEventListener('input', e=>{
    if(kind==='activity') voteForm.activityNoteInput = e.target.value; else voteForm.foodNoteInput = e.target.value;
  });
  const addBtn = document.getElementById(`${kind}-note-add-btn`);
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const val = (kind==='activity'?voteForm.activityNoteInput:voteForm.foodNoteInput).trim();
    if(!val) return;
    if(kind==='activity'){ voteForm.activityNotes.push(val); voteForm.activityNoteInput=''; }
    else { voteForm.foodNotes.push(val); voteForm.foodNoteInput=''; }
    render();
  });
  document.querySelectorAll(`.rm-other[data-kind="${kind}"]`).forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx);
      if(kind==='activity') voteForm.activityNotes.splice(idx,1); else voteForm.foodNotes.splice(idx,1);
      render();
    });
  });
}

      <div style="margin-left:38px;" class="other-add-row">
        <input type="text" id="resto-name-input" placeholder="식당 이름" value="${esc(restaurantForm.newOptionName)}">
        <button id="resto-add-btn">추가</button>

    <div class="card">

function bindRestaurantEvents(doc){
  const options = (doc.restaurant && doc.restaurant.options) || [];
  const restoRes = computeRestoResults(doc);
  if(finalizeForm.optionId===null && restoRes.winnerId) finalizeForm.optionId = restoRes.winnerId;

  document.getElementById('naver-budget-input').addEventListener('input', e=> naverBudget = e.target.value );
  document.getElementById('naver-search-btn').addEventListener('click', (ev)=>{
    naverGeoError = '';
    if(!navigator.geolocation){
      naverGeoError = '이 브라우저에서는 위치 정보를 사용할 수 없어요.';
      render();
      return;
    }
    const btn = ev.currentTarget;
    btn.disabled = true; btn.textContent = '위치 확인 중...';
    navigator.geolocation.getCurrentPosition((pos)=>{
      const { latitude, longitude } = pos.coords;
      const food = (doc.resultsA && doc.resultsA.winnerFoods && doc.resultsA.winnerFoods[0]) || '맛집';
      const budgetNum = parseInt(naverBudget);
      let priceWord = '';
      if(budgetNum){
        if(budgetNum <= 10000) priceWord = '저렴한 ';
        else if(budgetNum <= 20000) priceWord = '가성비 ';
      }
      const query = `${priceWord}${food} 맛집`;
      const url = `https://map.naver.com/p/search/${encodeURIComponent(query)}?c=${longitude},${latitude},15,0,0,0,dh`;
      window.open(url, '_blank');
      btn.disabled = false; btn.textContent = '🗺️ 네이버지도에서 찾기';
    }, (err)=>{
      console.error(err);
      naverGeoError = '위치 권한을 허용해주셔야 사용할 수 있어요.';
      btn.disabled = false; btn.textContent = '🗺️ 네이버지도에서 찾기';
      render();
    });
  });

  document.getElementById('resto-name-input').addEventListener('input', e=> restaurantForm.newOptionName=e.target.value );
  document.getElementById('resto-note-input').addEventListener('input', e=> restaurantForm.newOptionNote=e.target.value );
  document.getElementById('resto-add-btn').addEventListener('click', async ()=>{
    const name = restaurantForm.newOptionName.trim();
    if(!name){ restoAddError='식당 이름을 입력해주세요.'; render(); return; }
    restoAddError='';
    try{
      await addRestaurantOption(name, restaurantForm.newOptionNote.trim());
      restaurantForm.newOptionName=''; restaurantForm.newOptionNote='';
    }catch(e){ console.error(e); restoAddError='추가에 실패했어요.'; render(); }
  });

  document.querySelectorAll('.resto-pill[data-id]').forEach(el=>{
    el.addEventListener('click', ()=>{ restaurantForm.selectedOptionId = el.dataset.id; render(); });
  });

  document.getElementById('resto-submit-btn').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const errEl = document.getElementById('resto-vote-error');
    const name = restaurantForm.name.trim();
    if(!name){ errEl.textContent='이름을 입력해주세요.'; errEl.style.display='block'; return; }
    if(!restaurantForm.selectedOptionId){ errEl.textContent='식당을 선택해주세요.'; errEl.style.display='block'; return; }
    errEl.style.display='none';
    btn.disabled=true; btn.textContent='저장 중...';
    try{
      await saveRestoVote(name, restaurantForm.selectedOptionId, editingRestoVoter);
      editingRestoVoter=null;
      restaurantForm = { name:'', newOptionName:'', newOptionNote:'', selectedOptionId:null };
    }catch(e){
      console.error(e);
      errEl.textContent='저장에 실패했어요.'; errEl.style.display='block';
      btn.disabled=false; btn.textContent=editingRestoVoter?'투표 수정하기':'식당 투표하기';
    }
  });

  document.querySelectorAll('.edit-resto-vote').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = btn.dataset.name;
      editingRestoVoter = n;
      restaurantForm = { name:n, newOptionName:'', newOptionNote:'', selectedOptionId: doc.restaurant.votes[n] || null };
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  document.querySelectorAll('.finalize-pill').forEach(el=>{
    el.addEventListener('click', ()=>{ finalizeForm.optionId = el.dataset.id; render(); });
  });
  document.getElementById('finalize-time').addEventListener('input', e=> finalizeForm.time = e.target.value );

  const fbtn = document.getElementById('finalize-btn');
  if(fbtn) fbtn.addEventListener('click', ()=>{
    const errEl = document.getElementById('finalize-error');
    if(!finalizeForm.optionId){ errEl.textContent='식당을 선택해주세요.'; errEl.style.display='block'; return; }

const ROULETTE_COLORS = ['#111111','#F9D423','#FFFFFF','#FF4B3E'];
function renderRoulette(){
  const n = rouletteNames.length;
  const seg = n>0 ? 360/n : 0;
  let gradient = '#E4DCC0';
  if(n>0){
    const parts = rouletteNames.map((name,i)=>{
      const color = ROULETTE_COLORS[i % ROULETTE_COLORS.length];
      return `${color} ${(i*seg).toFixed(2)}deg ${((i+1)*seg).toFixed(2)}deg`;
    });
    gradient = `conic-gradient(from 0deg, ${parts.join(', ')})`;
  }
  const labels = rouletteNames.map((name,i)=>{
    const mid = i*seg + seg/2;
    const color = ROULETTE_COLORS[i % ROULETTE_COLORS.length];
    const textColor = (color==='#F9D423' || color==='#FFFFFF') ? '#111111' : '#FFFFFF';
    return `<div class="wheel-label" style="transform:rotate(${mid}deg);">
      <span style="color:${textColor};">${esc(name)}</span>
    </div>`;
  }).join('');

  return `
    ${heroBlock('돌림판으로 재미있게 정해요')}
    <div class="topnav" style="justify-content:flex-start; margin-top:-6px;">
      <button class="ghost-btn" id="back-btn">← 돌아가기</button>
    </div>
    <div class="card">
      <div class="step-label"><span class="step-num">1</span> 참여자 이름 추가</div>
      <p class="step-desc">메뉴를 정할 사람들의 이름을 넣어주세요 (2명 이상)</p>
      <div style="margin-left:38px;" class="other-add-row">
        <input type="text" id="roulette-name-input" placeholder="이름 입력" value="${esc(rouletteNameInput)}">
        <button id="roulette-add-btn">추가</button>
      </div>
      ${currentDoc && currentDoc.votes && Object.keys(currentDoc.votes).length ? `<div style="margin-left:38px; margin-top:8px;"><button class="ghost-btn" id="roulette-import-btn">🙋 지금 투표자 명단 불러오기</button></div>` : ''}
      ${rouletteNames.length ? `<div class="other-chip-row" style="margin-left:38px; margin-top:10px;">${rouletteNames.map((n,i)=>`<span class="other-chip">${esc(n)} <button data-idx="${i}" class="rm-roulette-name">✕</button></span>`).join('')}</div>` : ''}
    </div>

    <div class="card" style="text-align:center;">
      <div class="step-label" style="justify-content:center;"><span class="step-num">2</span> 돌려서 정하기</div>
      <div class="roulette-wrap">
        <div class="roulette-pointer">▼</div>
        <div class="roulette-wheel-outer">
          <div class="roulette-wheel" id="roulette-wheel" style="background:${gradient}; transform:rotate(${rouletteRotation}deg);">
            ${labels}
          </div>
        </div>
      </div>
      <button class="admin-btn" id="roulette-spin-btn" style="margin-top:18px;" ${(rouletteNames.length<2||rouletteSpinning)?'disabled':''}>${rouletteSpinning?'돌아가는 중...':'🎡 돌리기'}</button>
      ${rouletteWinner ? `<div class="final-row" style="justify-content:center; margin-top:16px; font-size:17px;">🎉 <b style="color:var(--red);">${esc(rouletteWinner)}</b>님이 메뉴를 정합니다!</div>` : ''}
    </div>
  `;
}
function bindRouletteEvents(){
  document.getElementById('back-btn').addEventListener('click', goHome);
  document.getElementById('roulette-name-input').addEventListener('input', e=> rouletteNameInput = e.target.value );
  document.getElementById('roulette-add-btn').addEventListener('click', ()=>{
    const val = rouletteNameInput.trim();
    if(!val) return;
    rouletteNames.push(val);
    rouletteNameInput = '';
    rouletteWinner = null;
    render();
  });
  const importBtn = document.getElementById('roulette-import-btn');
  if(importBtn) importBtn.addEventListener('click', ()=>{
    const voterNames = Object.keys((currentDoc && currentDoc.votes) || {});
    rouletteNames = Array.from(new Set([...rouletteNames, ...voterNames]));
    render();
  });
  document.querySelectorAll('.rm-roulette-name').forEach(el=>{
    el.addEventListener('click', ()=>{
      rouletteNames.splice(parseInt(el.dataset.idx),1);
      rouletteWinner = null;
      render();
    });
  });
  const spinBtn = document.getElementById('roulette-spin-btn');
  if(spinBtn) spinBtn.addEventListener('click', ()=>{
    if(rouletteSpinning || rouletteNames.length<2) return;
    const n = rouletteNames.length;
    const seg = 360/n;
    const winnerIndex = Math.floor(Math.random()*n);
    const mid = winnerIndex*seg + seg/2;
    const targetMod = (360 - mid + 360) % 360;
    const currentMod = ((rouletteRotation % 360) + 360) % 360;
    const delta = ((targetMod - currentMod) + 360) % 360;
    const newRotation = rouletteRotation + 360*5 + delta;

    rouletteSpinning = true;
    rouletteWinner = null;
    const wheelEl = document.getElementById('roulette-wheel');
    spinBtn.disabled = true; spinBtn.textContent = '돌아가는 중...';
    if(wheelEl){
      wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15,0.65,0.15,1)';
      wheelEl.style.transform = `rotate(${newRotation}deg)`;
    }
    rouletteRotation = newRotation;
    setTimeout(()=>{
      rouletteSpinning = false;
      rouletteWinner = rouletteNames[winnerIndex];
      render();
    }, 4300);
  });
}

  return `
    <div style="position:relative; width:${size}px; height:${size*511/705}px; margin:0 auto;">
      ${layers.map(src=>`<img src="${src}" style="position:absolute; inset:0; width:100%; height:100%;">`).join('')}
    </div>
  `;
}

function bindChangePasswordEvents(){
  document.getElementById('pw-current').addEventListener('input', e=> changePwForm.current = e.target.value );
  document.getElementById('pw-new1').addEventListener('input', e=> changePwForm.new1 = e.target.value );
  document.getElementById('pw-new2').addEventListener('input', e=> changePwForm.new2 = e.target.value );

  document.getElementById('pw-change-btn').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const { current, new1, new2 } = changePwForm;
    if(!current || !new1){ changePwError='현재 비밀번호와 새 비밀번호를 입력해주세요.'; changePwSuccess=''; render(); return; }
    if(new1.length<6){ changePwError='새 비밀번호는 6자 이상이어야 해요.'; changePwSuccess=''; render(); return; }
    if(new1 !== new2){ changePwError='새 비밀번호가 서로 달라요.'; changePwSuccess=''; render(); return; }
    changePwError=''; btn.disabled=true; btn.textContent='변경 중...';
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(authUser.email, current);
      await authUser.reauthenticateWithCredential(cred);
      await authUser.updatePassword(new1);
      changePwSuccess = '비밀번호가 변경됐어요!';
      changePwForm = { current:'', new1:'', new2:'' };
    }catch(e){
      console.error(e);
      changePwError = e.code==='auth/wrong-password' ? '현재 비밀번호가 올바르지 않아요.' : '변경에 실패했어요. 다시 시도해주세요.';
    }
    btn.disabled=false; btn.textContent='비밀번호 변경';
    render();
  });
}

function renderBudget(){

  const spent = expenses.reduce((s,e)=>s+e.amount,0);
  const remain = total - spent;
  const pct = total>0 ? Math.min(100, Math.round(spent/total*100)) : 0;

  return `

      <div class="progress-label" style="text-align:left; margin-bottom:4px;">${remain.toLocaleString()}원 남음 / 총 ${total.toLocaleString()}원</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${remain<0?'var(--red)':'var(--ink)'};"></div></div>
      <p class="hint">지금까지 쓴 금액: ${spent.toLocaleString()}원</p>

            </div>
            ${isConfirming ? `
              <div style="display:flex; gap:4px; flex-shrink:0;">
                <button class="ghost-btn" data-cancel-exp="${e.createdAt}" style="padding:5px 9px; font-size:11px;">취소</button>
                <button class="ghost-btn" data-confirm-exp="${e.createdAt}" style="padding:5px 9px; font-size:11px; border-color:var(--red); color:var(--red);">삭제확정</button>
              </div>
            ` : `<button class="ghost-btn" data-del-exp="${e.createdAt}" style="padding:5px 9px; font-size:12px; flex-shrink:0;">🗑</button>`}
          </div>
        </div>`;
      }).join('')}
  `;
}

function bindBudgetEvents(){
  const editBtn = document.getElementById('budget-total-edit-btn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    budgetTotalInput = String((budgetDoc && budgetDoc.totalBudget) || '');
    budgetEditingTotal = true;
    render();
  });
  const totalInput = document.getElementById('budget-total-input');
  if(totalInput) totalInput.addEventListener('input', e=> budgetTotalInput = e.target.value );
  const saveBtn = document.getElementById('budget-total-save-btn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const val = Math.max(0, parseInt(budgetTotalInput)||0);
    saveBtn.disabled = true; saveBtn.textContent='저장 중...';
    try{ await setBudgetTotal(val); budgetEditingTotal=false; }
    catch(e){ console.error(e); }
    saveBtn.disabled = false; saveBtn.textContent='저장';
    render();
  });

  document.getElementById('expense-amount-input').addEventListener('input', e=> expenseForm.amount = e.target.value );
  document.getElementById('expense-memo-input').addEventListener('input', e=> expenseForm.memo = e.target.value );
  document.getElementById('expense-add-btn').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const errEl = document.getElementById('expense-error');
    const amount = parseInt(expenseForm.amount);
    if(!amount || amount<=0){ errEl.textContent='금액을 정확히 입력해주세요.'; errEl.style.display='block'; return; }
    errEl.style.display='none';
    btn.disabled=true; btn.textContent='추가 중...';
    try{
      await addExpense(amount, expenseForm.memo.trim());
      expenseForm = { amount:'', memo:'' };
    }catch(e){
      console.error(e);
      errEl.textContent='추가에 실패했어요.'; errEl.style.display='block';
    }
    btn.disabled=false; btn.textContent='지출 추가';
    render();
  });

  document.querySelectorAll('[data-del-exp]').forEach(el=>{
    el.addEventListener('click', ()=>{ expenseDeleteConfirmId = parseInt(el.dataset.delExp); render(); });
  });
  document.querySelectorAll('[data-cancel-exp]').forEach(el=>{
    el.addEventListener('click', ()=>{ expenseDeleteConfirmId = null; render(); });
  });
  document.querySelectorAll('[data-confirm-exp]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      const createdAt = parseInt(ev.currentTarget.dataset.confirmExp);
      ev.currentTarget.disabled = true;
      try{ await deleteExpense(createdAt); }catch(e){ console.error(e); }
      expenseDeleteConfirmId = null;
      render();
    });
  });
}

/* ==================== 시작 ==================== */
async function resolveTeamForUser(){
  if(teamId){ teamEntryLoaded = true; return; } // 이미 URL 등으로 해결됨
  const urlTeamId = getTeamIdFromUrl();
  if(urlTeamId){
    try{
      const snap = await teamsRef.doc(urlTeamId).get();
      if(snap.exists){
        enterTeam(urlTeamId, snap.data());
        return;
      }
    }catch(e){ console.error(e); }
  }
  // URL에 팀 코드가 없으면, 이전에 등록된 소속 팀을 찾아 자동 입장
  try{
    const mapped = await lookupUserTeam(authUser.uid);
    if(mapped && mapped.teamId){
      const teamSnap = await teamsRef.doc(mapped.teamId).get();
      if(teamSnap.exists){
        enterTeam(mapped.teamId, teamSnap.data());
        return;
      }
    }
  }catch(e){ console.error(e); }
  teamEntryLoaded = true; // 소속 팀을 못 찾음 -> 팀 입장 화면 표시
}

async function bootstrap(){
  if(!firebaseReady){ render(); return; }
  loadOrgDivisions();
  auth.onAuthStateChanged(async (user)=>{
    authUser = user;
    authLoaded = true;
    if(user){
      await resolveTeamForUser();
    }
    render();
  });
  render();
}
bootstrap();
</script>
